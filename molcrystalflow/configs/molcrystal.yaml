defaults:
  - _self_
  - model
  - molcrystal_paths
  - molcrystal_lattice

data:
  task: molcrystal_csp
  dataset: Thurlemann2023
  cache_dir: ${paths.data_dir}

  loader:
    num_workers: 24
    prefetch_factor: 8
    batch_size:
      train: 128
      valid: 512
      test: 512

interpolant:
  min_t: 1e-2

  rots:
    corrupt: True
    batch_ot: True
    sample_schedule: exp
    exp_rate: 10
    prior_type: 'symmetric'  # 'symmetric', 'uniform'

  trans: 
    corrupt: True
    batch_ot: True
    sample_schedule: linear
    scaling: 10.0
    prior_type: 'uniform'  # 'uniform', 'gaussian'

  lattice:
    corrupt: True
    lognormal:
      loc: ${lattice.lognormal.loc}
      scale: ${lattice.lognormal.scale}
    uniform:
      low: 60.0
      high: 120.0
      eps: 0.1
  
  sampling:
    num_timesteps: 50

experiment:
  debug: False
  seed: 123
  num_devices: 1
  warm_start: null
  warm_start_cfg_override: True
  training:
    trans_scale: 1.0
    translation_loss_weight: 2.0
    t_normalize_clip: 0.9
    rotation_loss_weights: 1.0
    cell_loss_weight: 0.1
  wandb:
    name: ${data.task}_${data.dataset}
    project: molcrystal-csp
    save_dir: ${paths.wandb_dir}
  wandb_watch:
    log: 'all'
    log_freq: 500
  optimizer:
    lr: 1e-4
    betas:
      - 0.9
      - 0.98
    eps: 1e-8
    weight_decay: 1e-2
  use_lr_scheduler: True
  lr_scheduler:
    factor: 0.6
    patience: 10
    min_lr: 1e-6
  trainer:
    overfit_batches: 0
    min_epochs: 1 # prevents early stopping
    max_epochs: 1000
    accelerator: auto
    # devices: auto
    log_every_n_steps: 1
    deterministic: False
    # strategy: ddp
    val_check_interval: 1.0
    check_val_every_n_epoch: 1
    accumulate_grad_batches: 1
    gradient_clip_val: 0.5
  checkpointer:
    dirpath: ${paths.ckpt_dir}
    save_last: True
    save_top_k: 3
    monitor: valid/loss
    filename: epoch_{epoch}-step_{step}-loss_{valid/loss:.4f}
    auto_insert_metric_name: False
    mode: min
  # Keep this null. Will be populated at runtime.
  inference_dir: null

hydra:
  run:
    dir: ${paths.log_dir}